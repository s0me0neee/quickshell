; Read by services/Cava.qml, not by a terminal. cava writes one line of
; semicolon-separated levels per frame to stdout and the shell parses them.
;
; Kept deliberately cheap: thirty frames a second is plenty for something that
; only runs while music plays and the card is open. Twenty-eight bars across the
; card's 340px leaves each one thin enough to read as a bar rather than a blob.
;
; `bars` must match Cava.bars in services/Cava.qml.

[general]
mode = normal
framerate = 30
bars = 28
autosens = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
; 0-100 per bar, ';' between bars, newline between frames
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 40
