# Hyprland integration for this shell. Source it from your Hyprland config:
#
#   source = ~/.config/quickshell/hypr/quickshell.conf
#
# Everything the shell needs from the compositor lives here, so moving the shell to
# another machine is: clone the repo, source this file, add the matugen template.

# Blur every surface the shell creates. Namespaces all start with qs-.
# Layer rules are applied when a surface is created, so restart the shell after
# changing them: qs kill; qs -d -n
layerrule = blur on, match:namespace ^(qs-.*)$
layerrule = ignore_alpha 0.1, match:namespace ^(qs-.*)$

# Autostart. -d detaches from the terminal, -n refuses to start a second copy.
exec-once = qs -d -n

# Restart the shell. qs kill returns before the old instance exits, and -n would then
# refuse to start, so wait (up to 5s) for it to go
bind = SUPER SHIFT, B, exec, qs kill; for i in $(seq 50); do pgrep -x qs >/dev/null || break; sleep 0.1; done; qs -d -n
# Clipboard is bound by the user's Hyprland keybinds (`qs ipc call clipboard toggle`).
# Do not add a second Win+V bind here: two toggle actions cancel each other out.
